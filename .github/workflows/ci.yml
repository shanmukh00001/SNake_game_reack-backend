name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "client/package.json"

      - name: Install Client Dependencies
        run: npm install
        working-directory: client

      - name: Run Client Unit Tests
        run: npm run test
        working-directory: client

      - name: Build Client (Vite)
        run: npm run build
        working-directory: client

  server-verification:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "server/package.json"

      - name: Install Server Dependencies
        run: npm install
        working-directory: server

      - name: Run Server Tests
        run: npm run test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/snakeDB_test
          JWT_SECRET: ci_test_jwt_secret_token_12345
          NODE_ENV: test
        working-directory: server
