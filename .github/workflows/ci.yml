name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "client/package.json"

      - name: Install Client Dependencies
        run: npm install
        working-directory: client

      - name: Run Client Unit Tests
        run: npm run test
        working-directory: client

      - name: Build Client (Vite)
        run: npm run build
        working-directory: client

  server-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "server/package.json"

      - name: Install Server Dependencies
        run: npm install
        working-directory: server

      - name: Run Server Tests
        run: npm run test
        working-directory: server
